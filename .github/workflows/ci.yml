name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-release-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release contents
        run: python tools/release_audit.py --strict-local --strict-private

      - name: Validate native media boundary
        run: python tools/audit_native_media.py

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run frontend structure regressions
        run: |
          for test in tests/test_*.mjs; do node "$test"; done
